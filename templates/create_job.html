{% extends 'base.html' %}

{% block title %}Create Job - Resume Screener{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="d-flex align-items-center justify-content-between mb-4">
      <div>
        <h3 class="fw-bold text-dark mb-1">Post a New Job</h3>
        <p class="text-muted small mb-0">Fill in the job details and skills required for candidate matching.</p>
      </div>
      <a href="{{ url_for('jobs') }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i> Back to Jobs
      </a>
    </div>

    <div class="custom-card">
      <div class="card-body p-4">
        <form method="POST" action="{{ url_for('create_job') }}">
          <div class="mb-3">
            <label for="title" class="form-label fw-semibold">Job Title <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="title" name="title" placeholder="e.g., Python Developer, Data Analyst" required>
          </div>

          <div class="mb-3">
            <label for="skills" class="form-label fw-semibold">Required Skills (separated by commas) <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="skills" name="skills" placeholder="e.g., Python, Flask, SQL, HTML, CSS, Git" required>
            <div class="form-text">Type the main skills separated by commas (e.g. Python, SQL, React).</div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label for="education" class="form-label fw-semibold">Required Education</label>
              <input type="text" class="form-control" id="education" name="education" placeholder="e.g., B.Tech, MCA, B.Sc or Any Graduate">
            </div>
            <div class="col-md-6">
              <label for="experience" class="form-label fw-semibold">Experience Needed</label>
              <input type="text" class="form-control" id="experience" name="experience" placeholder="e.g., Fresher or 1-2 years">
            </div>
          </div>

          <div class="mb-4">
            <label for="description" class="form-label fw-semibold">Job Description <span class="text-danger">*</span></label>
            <textarea class="form-control" id="description" name="description" rows="5" placeholder="Write a short description of the responsibilities and role..." required></textarea>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary px-4 fw-semibold">
              <i class="bi bi-check-circle me-1"></i> Post Job
            </button>
            <a href="{{ url_for('jobs') }}" class="btn btn-outline-secondary px-4">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
