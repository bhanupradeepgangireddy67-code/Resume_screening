{% extends 'base.html' %}

{% block title %}Login - Resume Screener{% endblock %}

{% block public_content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
        <div class="text-center mb-4">
          <div class="brand-icon d-inline-block mb-3" style="font-size: 1.5rem;">
            <i class="bi bi-box-arrow-in-right"></i>
          </div>
          <h3 class="fw-bold text-dark">Sign In</h3>
          <p class="text-muted small">Access your Recruiter or Candidate dashboard</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control border-start-0" id="email" name="email" placeholder="name@example.com" required>
            </div>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="Enter your password" required>
              <button type="button" class="btn btn-outline-secondary" id="toggle-password" aria-label="Show password" aria-pressed="false">
                <i class="bi bi-eye" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
            <i class="bi bi-door-open me-1"></i> Log In
          </button>
        </form>

        <div class="text-center mt-4">
          <p class="text-muted small mb-0">Don't have an account yet? 
            <a href="{{ url_for('register') }}" class="fw-semibold">Register here</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
