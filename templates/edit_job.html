{% extends 'base.html' %}

{% block title %}Edit Job Opening - Resume Screening System{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="d-flex align-items-center justify-content-between mb-4">
      <div>
        <h3 class="fw-bold text-dark mb-1">Edit Job Opening</h3>
        <p class="text-muted small mb-0">Update requirements or job details.</p>
      </div>
      <a href="{{ url_for('jobs') }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i> Back to Jobs
      </a>
    </div>

    <div class="custom-card">
      <div class="card-body p-4">
        <form method="POST" action="{{ url_for('edit_job', id=job.id) }}">
          <div class="mb-3">
            <label for="title" class="form-label fw-semibold">Job Title <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="title" name="title" value="{{ job.title }}" required>
          </div>

          <div class="mb-3">
            <label for="skills" class="form-label fw-semibold">Required Skills (Comma separated) <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="skills" name="skills" value="{{ job.skills }}" required>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label for="education" class="form-label fw-semibold">Required Education</label>
              <input type="text" class="form-control" id="education" name="education" value="{{ job.education or '' }}">
            </div>
            <div class="col-md-6">
              <label for="experience" class="form-label fw-semibold">Required Experience</label>
              <input type="text" class="form-control" id="experience" name="experience" value="{{ job.experience or '' }}">
            </div>
          </div>

          <div class="mb-4">
            <label for="description" class="form-label fw-semibold">Job Description <span class="text-danger">*</span></label>
            <textarea class="form-control" id="description" name="description" rows="5" required>{{ job.description }}</textarea>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary px-4 fw-semibold">
              <i class="bi bi-check-circle me-1"></i> Save Changes
            </button>
            <a href="{{ url_for('job_details', id=job.id) }}" class="btn btn-outline-secondary px-4">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
